name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install .
          pip install nuitka ordered-set zstandard

      - name: Build exe
        shell: cmd
        run: |
          python -m nuitka ^
            --onefile ^
            --windows-console-mode=disable ^
            --output-filename=nmstoolkit.exe ^
            --include-data-dir=src/nmstoolkit/data=nmstoolkit/data ^
            --include-package=nmstoolkit.gui.tabs ^
            --include-module=PySide6.QtOpenGLWidgets ^
            --enable-plugin=pyside6 ^
            --assume-yes-for-downloads ^
            src/nmstoolkit/app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmstoolkit-windows
          path: nmstoolkit.exe

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nmstoolkit-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nmstoolkit.exe
          generate_release_notes: true
          prerelease: true
          name: "${{ github.ref_name }} (beta)"
